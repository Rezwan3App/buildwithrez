# Supabase pauses free projects after about a week without traffic. One small read a day keeps it awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 13 * * *" # daily, about 9 AM New York
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one published role
        run: |
          curl -fsS -o /dev/null \
            -H "apikey: sb_publishable_WuWyMoLwvSYxuw_cN2XkNw_AnEMmZua" \
            "https://odluoydzbraqdyrccmdi.supabase.co/rest/v1/roles?select=sort&limit=1"
